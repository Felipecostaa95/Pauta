# ─────────────────────────────────────────────────────────────
# PAUTA — configuración
# ─────────────────────────────────────────────────────────────

db: data/pauta.db
out_dir: reports

# ── Retención ─────────────────────────────────────────────────
# data/pauta.db crece ~2.4 MB/día (sobre todo items/item_entities: título+url+
# extra de cada item recolectado). spike.detect() nunca mira más atrás que
# spike.window_days (28) y evidence()/explain() solo leen el día que se está
# corriendo — así que nada de esto se pierde funcionalmente al podar. Medido
# contra una copia real: sin podar, GitHub rechaza el push en cuanto el
# archivo pasa los 100 MB (bloquea la pauta diaria, literal). 30 días (28 +
# 2 de margen) da ~72 MB en régimen permanente. Ver tm/db.py (prune).
retention:
  days: 30

# ── Mercados ────────────────────────────────────────────────
# cpm_index: cuánto vale un espectador de este mercado respecto
# al hispano (=1.0). Se usa para priorizar, no para detectar.
markets:
  - id: US
    name: Estados Unidos
    geo: US
    lang: en
    gnews: { hl: en-US, gl: US, ceid: "US:en" }
    cpm_index: 8.5
    reddit: [worldnews, news, popular, InternetIsBeautiful, OutOfTheLoop]

  - id: FR
    name: Francia
    geo: FR
    lang: fr
    gnews: { hl: fr, gl: FR, ceid: "FR:fr" }
    cpm_index: 3.0
    reddit: [france, actualites]

  - id: MX
    name: México
    geo: MX
    lang: es
    gnews: { hl: es-419, gl: MX, ceid: "MX:es-419" }
    cpm_index: 1.0
    reddit: [mexico, espanol]

# ── Fuentes ─────────────────────────────────────────────────
sources:
  gtrends:   { enabled: true }
  gnews:
    enabled: true
    topics: [WORLD, NATION, TECHNOLOGY, ENTERTAINMENT, SCIENCE, HEALTH]
  youtube:
    enabled: true          # requiere YOUTUBE_API_KEY
    # YouTube NO genera temas por sí solo. `chart=mostPopular` mide AUDIENCIA
    # (lo más visto) y este monitor busca PICOS de actividad y discusión. Así
    # que el video cumple dos roles y nada más: CORROBORAR temas que ya están
    # picando en otras fuentes, y APORTAR shorts virales noticiosos que pasen
    # filtros estrictos. Las reglas de admisión por video están en
    # tm/ytrules.py; acá solo se decide qué se recolecta.
    #
    # Categorías: se sacaron 10 (Música = videoclips), 22 (Gente y blogs =
    # vlogs) y 23 (Comedia = sketches de youtubers). Nada de 24/28, que son
    # las que traían youtubers y gameplays.
    categories: ["15", "17", "25"]
    # 15 = Mascotas y animales (rescates, animales virales) ·
    # 17 = Deportes (golazos, knockouts) ·
    # 25 = Noticias y política (clips noticiosos; la guerra la saca el filtro).
    #
    # Seguridad extra en tm/sources.py: se descarta cualquier video cuyo
    # snippet.categoryId REAL sea "20" (Gaming) o "10" (Música), sin importar
    # por qué lista entró.
    #
    # Duración máxima (segundos) para considerar un video un "short". Por
    # encima de esto es "largo" (vlog, programa, resumen) y solo entra si el
    # tema está corroborado el mismo día por una fuente que no sea video.
    short_max_seconds: 180

  # ── Agencias de video viral (estilo Newsflare) ──────────────
  # Newsflare, ViralHog y compañía no exponen RSS de su sitio, pero sí
  # publican en YouTube, y cada canal de YouTube tiene un RSS gratis y sin
  # cuota: https://www.youtube.com/feeds/videos.xml?channel_id=<ID>
  # De ahí salen los IDs de video; las estadísticas (vistas, comentarios,
  # duración) se piden con videos.list en lotes de 50 IDs = 1 unidad de cuota
  # por lote. Estos videos pasan por las MISMAS reglas de admisión que los de
  # chart=mostPopular (tm/ytrules.py), pero se muestran con chip propio.
  agencias_video:
    enabled: true
    # Estos clips NO pasan por el detector de picos por entidades: casi
    # ninguno nombra algo seguible ("Dog Gets Stuck In Chair") y forzarlos
    # llenaría la pauta de temas de un solo día, sin serie temporal contra la
    # cual medir nada. Van a su propia sección del reporte, "Clips virales del
    # día", rankeados por actividad. Ver tm/ytrules.py (clips_virales).
    clips_max: 12             # cuántos se muestran en la sección
    clips_window_hours: 48    # antigüedad máxima del clip
    canales:
      # Verificados con curl el 2026-09-24 (HTTP 200, 15 entradas cada uno).
      # Cadencia real medida el 2026-09-24 sobre las 15 entradas del feed:
      #   ViralHog     — último hace 1 h, 15 clips en 11 h  (~30/día, la fuente
      #                  viva de la sección)
      #   Caters Clips — último hace 26 h, 15 clips en 73 h (~5/día)
      #   Newsflare    — último hace 598 h (25 DÍAS). Su canal de YouTube está
      #                  dormido. Se deja activo igual: no cuesta cuota extra
      #                  y si retoman entran solos. Si en un mes sigue así,
      #                  conviene buscarles reemplazo.
      - { name: "Newsflare",     channel_id: "UCzSSoloGEz10HALUAbYhngQ", market: US }
      - { name: "ViralHog",      channel_id: "UC3339WgBDKIcxTfywuSmG8w", market: US }
      - { name: "Caters Clips",  channel_id: "UCcR4cyQyAF-guvk7Wm5Lbqg", market: US }
      # Jukin Media: DESACTIVADO. Lo había sumado por sus títulos ("Groomer
      # Helps Severely Matted Pomeranian Dog", "Geese March Through Streets Of
      # Denmark"), sin mirar las fechas: su último video es de hace ~16.800 h
      # (casi 2 años) y las 15 entradas del feed abarcan 24.000 h. El canal
      # está muerto, no dormido. No aporta un solo clip a la ventana de 48 h.
      - { name: "Jukin Media",   channel_id: "UCnNZkGsAg0chPOqvl7dvpDA", market: US, enabled: false }
      # Verificados y DESCARTADOS (el feed responde 200, el CONTENIDO no sirve):
      # - Storyful (UC_AFL88oKJgUJb0jK_LiOrQ): su canal de YouTube es
      #   marketing B2B, no clips. Últimas entradas reales al 2026-09-24:
      #   "How does AI-generated video show up during breaking news?", "The
      #   untapped editorial value of the comment section", "How big of a
      #   problem are deepfakes today?". Metería títulos de webinar como si
      #   fueran evidencia de un pico.
      # - FailArmy (UCPDis9pjXuqyI7RYLJ-TTSA): fails armados y compilaciones,
      #   justo lo que el ajuste pedía excluir. Entradas reales: "Best Instant
      #   Regret Fails | Beyond Embarrassed ep. 200,000.", "Why does this
      #   always happen? #fail #funny #viral". Cero contenido noticioso.
      # Si alguno cambia de línea editorial, alcanza con moverlo a `canales`.
      - { name: "Storyful",  channel_id: "UC_AFL88oKJgUJb0jK_LiOrQ", market: US, enabled: false }
      - { name: "FailArmy",  channel_id: "UCPDis9pjXuqyI7RYLJ-TTSA", market: US, enabled: false }

  wikipedia: { enabled: true }  # top-per-country pageviews, solo pauta diaria
  reddit:    { enabled: false }  # bloqueado, confirmado dos veces — ver README
  rss:
    enabled: true
    # Agencias y medios que quieras seguir directo, sin pasar por Google News.
    feeds:
      - { url: "https://feeds.bbci.co.uk/mundo/rss.xml",            market: MX, name: "BBC Mundo" }
      - { url: "https://www.infobae.com/arc/outboundfeeds/rss/",              market: MX, name: "Infobae" }
      # Nota: busqué RSS de farándula mexicana (TVNotas, Quién, SDP Noticias,
      # El Universal Espectáculos) y ninguno tiene un feed público que funcione
      # hoy — evitan el RSS a propósito para forzar tráfico a su app/sitio.
      # Google News (sources.gnews) igual trae bastante de este tema para MX.
      - { url: "https://feeds.bbci.co.uk/news/world/rss.xml",       market: US, name: "BBC World" }
      - { url: "https://www.theguardian.com/world/rss",             market: US, name: "The Guardian" }
      - { url: "https://www.tmz.com/rss.xml",                       market: US, name: "TMZ" }
      - { url: "https://www.etonline.com/news/rss",                 market: US, name: "ET Online" }
      - { url: "https://lawandcrime.com/feed/",                     market: US, name: "Law & Crime" }
      - { url: "https://www.justjared.com/feed/",                   market: US, name: "Just Jared" }
      - { url: "https://perezhilton.com/feed/",                     market: US, name: "Perez Hilton" }
      - { url: "https://www.dailymail.co.uk/tvshowbiz/index.rss",   market: US, name: "Daily Mail" }
      - { url: "https://metro.co.uk/entertainment/showbiz/feed/",   market: US, name: "Metro" }
      # Nota: probé The Sun (thesun.co.uk/tvandshowbiz/feed/) y devuelve HTTP
      # 200 pero con una página de verificación de Cloudflare ("Verifying
      # Device"), no RSS real — descartado. Ver README si se quiere reintentar
      # más adelante (podría depender de la IP/red desde donde se pida).
      - { url: "https://www.lemonde.fr/rss/une.xml",                market: FR, name: "Le Monde" }
      - { url: "https://www.francetvinfo.fr/titres.rss",            market: FR, name: "France Info" }
      - { url: "https://www.goodnewsnetwork.org/feed/",             market: US, name: "Good News Network" }
      - { url: "https://www.boredpanda.com/feed/",                  market: US, name: "Bored Panda" }
      - { url: "https://dailydot.com/feed/",                        market: US, name: "Daily Dot" }
      - { url: "https://knowyourmeme.com/newsfeed.rss",             market: US, name: "Know Your Meme" }
      # Deportes virales (ver categorias_destacadas.deporte_viral más abajo):
      - { url: "https://www.mmafighting.com/rss/index.xml",         market: US, name: "MMA Fighting" }
      - { url: "https://www.record.com.mx/rss",                     market: MX, name: "Récord" }
      # Verificados y DESCARTADOS (con curl -A "Mozilla/5.0 ..." antes de sumarlos):
      # - The Dodo (thedodo.com/feeds/feed.rss y variantes): 404 o HTML, no
      #   expone RSS público — es una SPA moderna sin feed real.
      # - People (people.com/feed/) y Entertainment Weekly (ew.com/feed/):
      #   ambos devuelven HTTP 402 con o sin User-Agent — Dotdash Meredith
      #   bloquea el scraping a nivel de borde, no es un tema de UA. Mismo
      #   patrón que The Sun (ver nota arriba): si algún día se necesita este
      #   contenido, Google News (sources.gnews) igual lo trae parcialmente.
      # - UNILAD (unilad.com/feed/, unilad.co.uk/feed/): 301 que termina en
      #   404 — es una SPA Next.js sin feed RSS público.
      # - LADbible (probadas /feed, /feed/, /rss, /rss.xml, /feeds/rss,
      #   /news/rss): todas 404. Su robots.txt solo lista sitemaps para
      #   Google News, no un feed RSS público. Misma familia de sitio
      #   (Next.js) que UNILAD, mismo resultado.
      # - ESPN (espn.com/espn/rss/news y variantes por deporte): HTTP 202
      #   vacío con "x-amzn-waf-action: challenge" — AWS WAF bloquea el
      #   request de bot antes de servir el XML, con o sin User-Agent.
      # - L'Équipe (lequipe.fr/rss/*.xml, varias secciones): HTTP 403 de
      #   Akamai en todos los intentos — mismo patrón que The Sun, bloqueo a
      #   nivel de borde. Google News (gnews, mercado FR) trae algo de este
      #   contenido de todos modos.
      # - MMA Junkie (mmajunkie.usatoday.com/feed): 404. Récord y MMA
      #   Fighting ya cubren el nicho de deportes de contacto/MX.

# ── Saturación (cuántos ya lo hicieron) ─────────────────────
# Para cada PICO pregunta a YouTube cuántos videos del tema se publicaron en
# la ventana reciente. Usa YOUTUBE_API_KEY; cada consulta cuesta 100 unidades
# de cuota (por eso el tope), contra ~12 de toda la recolección.
saturation:
  enabled: true
  window_hours: 24
  max_per_market: 5

# ── Detección de picos ──────────────────────────────────────
spike:
  window_days: 28        # ventana de baseline
  min_history: 5         # menos días que esto => se marca NUEVO, no pico
  min_volume: 2.0        # volumen mínimo del día para reportar algo
  z_watch: 1.8           # umbral "en observación"
  z_spike: 3.0           # umbral "pico"
  top_per_market: 12     # cuántas filas salen en la pauta

# ── Exclusión dura (gaming, guerras) ─────────────────────────
# Antes esto era un down-weight (factor 0.3): nunca llegaba a cero, el tema
# siempre sobrevivía con score bajo. El usuario probó eso y seguía viendo
# demasiado gaming y guerra. Ahora es exclusión real, y por NOTA individual:
# si el TÍTULO de una nota matchea alguno de estos términos, esa nota se
# descarta antes de vincularse a ningún tema (no el nombre del tema, no el
# resto de sus notas). Si a un tema no le queda ninguna nota limpia, ahí sí
# desaparece de la pauta — pero si tenía 5 notas y solo 1 era de gaming, las
# otras 4 lo arman igual. Ver tags.filter_excluded_items() (pauta diaria,
# run.py) y tm/breaking.py (_current_coverage, monitor).
#
# `scope` decide DÓNDE aplica cada categoría:
#   todo               -> pauta diaria (run.py) Y monitor de última hora
#                          (breaking_run.py / tm/breaking.py)
#   solo_pauta_diaria   -> SOLO run.py. breaking_run.py nunca la aplica.
#
# Match de palabra completa (word boundary), case-insensitive. Los términos
# ambiguos (que son palabras comunes fuera de contexto) se dejaron AFUERA a
# propósito en vez de intentar exigir contexto — mejor perder algún caso
# límite que descartar contenido bueno por error:
#   - gaming: "switch" (cambiar) y "steam" (vapor) son palabras de uso común;
#     "nintendo" ya cubre casi todos los titulares de Switch.
#   - conflicto: "army"/"invasion"/"invasión" aparecen constantemente fuera de
#     contexto bélico (ARMY = fandom de BTS, "invasión de turistas", Salvation
#     Army, etc.) y "frente"/"frontline" son de uso corriente ("frente frío",
#     "frontline workers"). Se sacaron de la lista.
excluir:
  gaming:
    scope: todo
    terms: [gaming, gamer, gamers, videojuego, videojuegos, video game,
            videogame, videogames, playstation, ps5, ps4, xbox, nintendo,
            esports, e-sports, fortnite, minecraft, roblox, call of duty,
            gta, gta5, gta6, gta v, valorant, league of legends, jeu vidéo, gameplay,
            speedrun, consola, console gaming, twitch, streamer, tarkov, caseoh, morecaseoh,
            pcgaming, pcgamer, let's play, walkthrough]
    # "probé" solo cuenta como gaming si además aparece un término de juego en
    # el mismo texto — sola es una palabra de uso corriente ("probé la
    # receta", "probé el auto") y descartaría contenido bueno. Ver
    # tags.excluded_categories() (combo = ancla + lista de términos afines,
    # mismo mecanismo que boda_viral en categorias_destacadas).
    combo:
      probé: [minecraft, roblox, fortnite, gta, valorant, nintendo,
              playstation, xbox, call of duty, videojuego, videojuegos,
              video game, gaming, gameplay]
  bailes:
    scope: todo
    # Los bailes son nicho, no pico noticioso: un reto de baile mete millones
    # de vistas sin que haya pasado nada. Match de palabra completa, igual que
    # el resto. "dance" SUELTO se deja AFUERA a propósito (mismo criterio que
    # "switch"/"steam" en gaming): aparece constantemente en noticias reales
    # ("dance of diplomacy", "Dance Theatre of Harlem", nombres de programas),
    # así que se piden las formas que sí nombran el baile como contenido.
    terms: [dance challenge, baile, bailando, coreografía, coreografia,
            choreography, dance trend, tiktok dance, danse, dance cover,
            dance video, dance routine]
  contenido_ia:
    scope: todo
    # Sin "AI" ni "IA" sueltos: aparecen en noticias normales y en otras
    # palabras. Match de palabra completa (o de símbolo completo para los
    # hashtags, ver tags._has_term).
    terms: [ai generated, ai-generated, made with ai, ai video, ai art,
            generado con ia, hecho con ia, creado con ia, video ia,
            généré par ia, sora, midjourney, deepfake, "#aiart", "#aivideo"]
  conflicto:
    scope: solo_pauta_diaria    # NO se aplica en breaking_run.py — a propósito
    terms: [guerra, war, guerre, misil, missile, bombardeo, airstrike,
            tropas, troops, ofensiva, offensive, ataque aéreo, ceasefire,
            alto el fuego, milicia, militia, artillería, artillery, ejército,
            military strike, military invasion, invasión militar, invasión rusa,
            drone strike, cazas, fighter jets, refugiados de guerra, soldados, soldiers]

# ── Categorías destacadas ────────────────────────────────────
# Badge visible + boost moderado (x1.3, una sola vez aunque matchee varias)
# para el contenido que el usuario más quiere ver arriba en la pauta. El boost
# se calcula sobre la evidencia que sobrevive a `excluir` (las notas de
# gaming/conflicto ya se sacaron antes de llegar acá) — así que un tema con
# una nota de gaming entre varias no pierde el boost por eso.
categorias_destacadas:
  celebridades: [celebrity, actor, actress, singer, famosa, famoso, star]
  rescate: [rescue, rescate, rescued, saved, sauvetage, rescatado]
  policial: [arrest, arrested, detenido, police, arrestado, custody]
  viral_ninos: [kid, child, niño, toddler, adorable, wholesome, enfant]
  # Sin "chat": en francés es gato, pero también es "chat" (conversación) —
  # término ambiguo, se deja afuera a propósito (mismo criterio que gaming).
  # La lista tenía solo mascotas (perro/gato). Medido contra los clips reales
  # de las agencias de video viral el 2026-09-24: la mitad son fauna salvaje
  # (delfín rescatado, ganso, cebra, leopardo, camello) y quedaban sin
  # categoría, así que ningún short de agencia podía entrar por señal viral —
  # la categoría destacada es requisito para eso (ver tm/ytrules.py).
  # Osos: "bear" SUELTO sigue afuera (en inglés es un verbo corriente: "bear
  # the cost", "bear arms"), pero las frases sí entran — ninguna tiene falso
  # positivo posible fuera del animal. "ours" (oso en francés) solo va en la
  # forma "ours brun" por lo mismo: suelto es el posesivo inglés.
  animales: [dog, puppy, cat, kitten, perro, perrito, gato, gatito,
             chien, chiot, chaton, animal, animals, wildlife,
             dolphin, delfín, delfin, dauphin, whale, ballena, baleine,
             shark, tiburón, tiburon, requin, goose, geese, ganso,
             deer, ciervo, zebra, cebra, zèbre, leopard, leopardo, léopard,
             camel, camello, chameau, raccoon, mapache, raton laveur,
             monkey, mono, singe, koala, panda, elephant, elefante, éléphant,
             horse, caballo, cheval, owl, búho, buho, hibou,
             black bear, brown bear, grizzly, polar bear, bear attack,
             bear cub, oso, osezno, oso pardo, osito, ours brun]
  parejas: [couple, pareja, novios, boyfriend, girlfriend, novio, novia,
            proposal, propuesta de matrimonio, demande en mariage, couple goals]
  # Caso especial: "boda/wedding" solo no alcanza (trae bodas de famosos,
  # moda, consejos). Solo cuenta si matchea un término de CADA grupo — el
  # momento caótico/gracioso, no la boda en sí. Ver tm/tags.py.
  boda_viral:
    grupo_boda: [boda, wedding, mariage, novia, bride, groom, novio, altar]
    grupo_gancho: [viral, fail, fallida, caos, chaos, disaster, desastre,
                   insólito, unexpected, worst, awkward, ridiculous,
                   se vuelve viral, goes viral, drama, pelea, brawl]
  # Mismo criterio que boda_viral: "fútbol"/"football" a secas trae resultados,
  # fichajes y tablas de posiciones, no lo viral. Lo viral es el MOMENTO (el
  # golazo, el knockout, la pelea), así que exige un término de grupo_deporte
  # Y uno de grupo_gancho en el mismo tema. Excepción: `solos` son términos que
  # son virales por definición (ya nombran el momento + el contexto callejero)
  # y activan la categoría sin necesitar además un término de deporte — ver
  # tags.matched_tags(), mismo mecanismo genérico de combo+solos.
  # Se sacaron "foot"/"goal"/"but" (foot y but son "fútbol"/"gol" en francés,
  # goal está en el paquete original) del listado propuesto: son palabras
  # comunes del inglés (pie, objetivo, conjunción "pero") y con un término de
  # gancho ambiguo como "brutal" alcanzaban a colar titulares de guerra reales
  # como deporte_viral, lo que los sacaba de la exclusión de conflicto (ver
  # guard más abajo). Probado: "Brutal attack continues, but troops hold the
  # line" quedaba sin excluir. Mismo criterio que army/invasion/steam/switch.
  # "box"/"ring" SÍ se agregaron a propósito (decisión explícita del usuario,
  # 2026-09-21, con el riesgo mostrado y aceptado) para rescatar videos de
  # boxeo tipo "Box Azteca" / "GUERRA EN EL RING" que sin esto caían
  # excluidos por conflicto (matchean "guerra") sin ningún término de deporte
  # que activara el guard. RIESGO CONOCIDO Y ACEPTADO: a diferencia de
  # but/foot/goal (sacados más arriba), "box"/"ring" SÍ pueden colar titulares
  # de guerra/desastre reales fuera de la exclusión de conflicto cuando
  # coinciden con un gancho genérico como "brutal" — probado con "Black box
  # recovered from brutal plane crash, troops search wreckage" y "Troops form
  # a ring around the city in a brutal siege" (ninguno de los dos queda
  # excluido). Si en producción aparece un caso así, esta es la primera
  # sospecha a revisar.
  deporte_viral:
    grupo_deporte: [fútbol, futbol, football, soccer, gol, box, ring,
                    nba, nfl, boxeo, boxing, boxe, ufc, mma, kickboxing,
                    lucha, wrestling, rugby, tenis, tennis, béisbol, baseball]
    grupo_gancho: [viral, golazo, knockout, ko, nocaut, brutal, insane,
                   increíble, incroyable, épico, epic, fail, blooper,
                   pelea, fight, brawl, bagarre, trifulca, bronca,
                   se vuelve viral, goes viral, record, récord]
    solos: [pelea callejera, street fight, bagarre de rue, knockout viral,
            riña callejera, pelea en la calle]

# ── Entidades ───────────────────────────────────────────────
entities:
  min_chars: 3
  max_doc_freq: 0.25     # descarta términos que aparecen en >25% de los titulares
  auto_alias: true       # fusiona "Trump" -> "Donald Trump" por co-ocurrencia
  alias_cooc: 0.6
  # Fusiones manuales. clave normalizada -> clave canónica
  aliases:
    eeuu: estados unidos
    usa: estados unidos
    us: estados unidos
  # Ruido que nunca es un tema
  stoplist:
    - video
    - videos
    - noticias
    - news
    - live
    - en vivo
    - directo
    - hoy
    - shorts
    - official trailer

# ── Capa editorial (opcional, requiere ANTHROPIC_API_KEY) ───
explain:
  enabled: true
  model: claude-sonnet-5
  max_topics_per_market: 8
